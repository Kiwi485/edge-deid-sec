services:
  acquisition:
    build: .
    container_name: edge-deid-acquisition
    command:
      - python
      - src/services/acquisition_service.py
      - --limit
      - "100"
      - --socket-mode
      - --socket-path
      - /tmp/edge_deid.sock
    depends_on:
      extraction:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./evidence:/app/evidence
      - ./tmp:/tmp
    restart: "no"

  extraction:
    build: .
    container_name: edge-deid-extraction
    command:
      - python
      - src/services/extraction_service.py
      - --socket-server
      - --socket-path
      - /tmp/edge_deid.sock
      - --max-requests
      - "100"
      - --reset-csv
      - --clear-out
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./evidence:/app/evidence
      - ./tmp:/tmp
    restart: "no"

  observability:
    build: .
    container_name: edge-deid-observability
    command:
      - python
      - src/services/observability_service.py
      - --manifest
      - evidence/batch/acquisition_manifest.json
    depends_on:
      extraction:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./docs:/app/docs
      - ./evidence:/app/evidence
    restart: "no"
