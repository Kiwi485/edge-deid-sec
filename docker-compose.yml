services:
  acquisition:
    build: .
    container_name: edge-deid-acquisition
    command:
      - python
      - src/services/acquisition_service.py
      - --limit
      - "-1"
    volumes:
      - ./data:/app/data
      - ./evidence:/app/evidence
    restart: "no"

  extraction:
    build: .
    container_name: edge-deid-extraction
    command:
      - python
      - src/services/extraction_service.py
      - --clear-out
      - --reset-csv
    depends_on:
      acquisition:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./evidence:/app/evidence
    restart: "no"

  observability:
    build: .
    container_name: edge-deid-observability
    command:
      - python
      - src/services/observability_service.py
    depends_on:
      extraction:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./docs:/app/docs
      - ./evidence:/app/evidence
    restart: "no"
