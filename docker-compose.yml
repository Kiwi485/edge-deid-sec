x-security: &security
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777

services:
  acquisition:
    <<: *security
    build: .
    container_name: edge-deid-acquisition
    cpus: "0.50"
    mem_limit: 512m
    command:
      - python
      - src/services/acquisition_service.py
      - --limit
      - "${BATCH_LIMIT:-100}"
      - --socket-mode
      - --socket-path
      - /run/edge-deid/edge_deid.sock
    depends_on:
      extraction:
        condition: service_healthy
    volumes:
      - ./data/raw:/app/data/raw:ro,z
      - ./evidence:/app/evidence:rw,z
      - ipc:/run/edge-deid
    restart: "no"

  extraction:
    <<: *security
    network_mode: none
    build:
      context: .
      args:
        INSTALL_TFLITE: ${INSTALL_TFLITE:-0}
    container_name: edge-deid-extraction
    cpus: "2.0"
    mem_limit: 4g
    environment:
      EDGE_DEID_TRACING: ${EDGE_DEID_TRACING:-off}
    command:
      - python
      - src/services/extraction_service.py
      - --socket-server
      - --seg-backend
      - ${SEG_BACKEND:-torch}
      - --socket-path
      - /run/edge-deid/edge_deid.sock
      - --max-requests
      - "${BATCH_LIMIT:-100}"
      - --reset-csv
    volumes:
      - ./data/out:/app/data/out:rw,z
      - ./logs:/app/logs:rw,z
      - ./models:/app/models:ro,z
      - ipc:/run/edge-deid
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; connection = socket.socket(socket.AF_UNIX); connection.connect('/run/edge-deid/edge_deid.sock'); connection.close()"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  observability:
    <<: *security
    build: .
    container_name: edge-deid-observability
    cpus: "1.5"
    mem_limit: 2g
    command:
      - python
      - src/services/observability_service.py
      - --manifest
      - evidence/batch/acquisition_manifest.json
    depends_on:
      extraction:
        condition: service_completed_successfully
    volumes:
      - ./data/raw:/app/data/raw:ro,z
      - ./data/out:/app/data/out:rw,z
      - ./logs:/app/logs:ro,z
      - ./docs:/app/docs:rw,z
      - ./evidence:/app/evidence:rw,z
    restart: "no"

volumes:
  ipc:
